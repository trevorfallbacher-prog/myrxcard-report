name = "myrxcard-sync"
main = "worker.js"
compatibility_date = "2026-07-01"

[vars]
XANO_CONTENT_URL = "https://xy2f-yrzu-6a37.n7d.xano.io/api:meta/workspace/1/table/12/content"
XANO_EVENTS_URL = "https://xy2f-yrzu-6a37.n7d.xano.io/api:meta/workspace/1/table/13/content"

# AAPS pricing snapshot (same KV namespace the avalon-aaps Pages project writes
# via /api/upload) — read-only here, served to the internal /nash/ dashboard
[[kv_namespaces]]
binding = "AAPS_DATA"
id = "dadeb13cc98d45a59ccc1cf032b725a6"

# Rate Limiting binding: caps password attempts per network ACROSS isolates
# (the worker's in-memory 5-per-10-min lockout is per isolate). Consumed by
# checkPassword() in worker.js, which runs without it if the binding is absent.
# 20 attempts / 60 s per network is far above what the admin page needs and
# far below anything a brute-force loop wants.
[[ratelimits]]
name = "ADMIN_RL"
namespace_id = "1001"
simple = { limit = 20, period = 60 }
